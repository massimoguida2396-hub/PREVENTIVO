<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081629"/><stop offset="1" stop-color="#153b47"/></linearGradient></defs><rect width="1080" height="1350" fill="url(#bg)"/><circle cx="985" cy="105" r="240" fill="#1a666b" opacity=".25"/><rect x="72" y="66" width="96" height="12" rx="6" fill="#5af1d3"/><text x="72" y="137" font-size="44" font-family="Arial,Helvetica,sans-serif" font-weight="800" fill="#ffffff">FUTURO PRATICO</text><text x="72" y="205" font-size="27" font-family="Arial,Helvetica,sans-serif" letter-spacing="2" fill="#a7c9d2">PROMPT 01 / PIANIFICA</text><text x="72" y="330" font-size="73" font-weight="800" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Metti ordine</text><text x="72" y="425" font-size="73" font-weight="800" font-family="Arial,Helvetica,sans-serif" fill="#5af1d3">nella settimana</text><rect x="65" y="535" width="950" height="540" rx="32" fill="#193c4b" stroke="#367784" stroke-width="3"/><rect x="105" y="585" width="148" height="51" rx="25" fill="#5af1d3"/><text x="179" y="621" font-size="28" font-family="Arial" font-weight="700" text-anchor="middle" fill="#082231">COPIA</text><text x="106" y="715" font-size="37" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Agisci come un assistente organizzativo.</text><text x="106" y="784" font-size="37" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Ti elenco tutti i miei impegni.</text><text x="106" y="853" font-size="37" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Crea un piano da lunedi a domenica</text><text x="106" y="922" font-size="37" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">con tempi realistici, pause e priorita.</text><text x="106" y="991" font-size="37" font-family="Arial,Helvetica,sans-serif" fill="#ffffff">Prima chiedimi cio che manca.</text><text x="72" y="1170" font-size="29" font-family="Arial,Helvetica,sans-serif" fill="#b4d0d8">Incolla il prompt e aggiungi i tuoi impegni.</text><line x1="72" y1="1235" x2="1008" y2="1235" stroke="#367784" stroke-width="2"/><text x="72" y="1295" font-size="28" fill="#a7c9d2" font-family="Arial,Helvetica,sans-serif">@praticofuturo</text><text x="1008" y="1295" text-anchor="end" font-size="28" fill="#a7c9d2" font-family="Arial,Helvetica,sans-serif">2 / 4</text></svg>